version: '3.8'

services:

  mysql-db:
    image: mysql:8
    container_name: java-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: java_project_db       # Your existing project database
      MYSQL_USER: java_user                 # Dedicated user for Java app
      MYSQL_PASSWORD: StrongPassword123!    # Password for that user
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql

  java-app:
    build: .                               # Make sure Dockerfile is in project root
    container_name: java-login-app
    depends_on:
      - mysql-db
    environment:
      DB_HOST: mysql-db
      DB_PORT: 3306
      DB_NAME: java_project_db
      DB_USER: java_user
      DB_PASSWORD: StrongPassword123!
    ports:
      - "8080:8080"

  nginx:
    image: nginx:latest
    container_name: nginx-frontend
    depends_on:
      - java-app
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf

volumes:
  mysql-data:
